[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.3"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
authors = ["Sami"]

[workspace.dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "wrap_help"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

# Database
rusqlite = { version = "0.34", features = ["bundled"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Parallel processing
rayon = "1.10"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.11", features = ["v4"] }

# Hostname detection
hostname = "0.4"

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }
dirs = "6.0"

# Testing
insta = "1.42"
tempfile = "3.15"

rig-core = "=0.40.0"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
futures-util = "0.3"
schemars = "=1.0.4"
# Only for the HTTP backend rig's client builder accepts: `ClientBuilder::timeout` to
# bound a request, and `Error::is_timeout` to recognise what that bound produced. Pinned
# to the same 0.13 rig resolves, so there is one reqwest in the graph and the error rig
# boxes really is the type this crate downcasts to.
reqwest = { version = "0.13", default-features = false }

# Internal crates
tt-core = { path = "crates/tt-core" }
tt-db = { path = "crates/tt-db" }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic lints we don't want
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
