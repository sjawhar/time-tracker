name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: taiki-e/install-action@cargo-deny

      - run: cargo fmt --check
      - run: cargo deny check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint frontend
        run: |
          cd crates/tt-server/web
          npm ci
          npm run check
          npm run lint
          npm run test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          # packages.microsoft.com apt repo periodically breaks signing on GH runners; we don't
          # need it (only libxkbcommon-dev, a base Ubuntu package), so drop any MS apt source.
          grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update && sudo apt-get install -y libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd crates/tt-server/web
          npm ci
          npm run build

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
