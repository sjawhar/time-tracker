# Time Tracker tmux hook configuration
#
# Records pane focus + scroll events for time tracking. Four focus hooks cover all
# navigation paths; a fifth (after-copy-mode) fires when a pane enters copy-mode
# (e.g. mouse-wheel up). The 500ms debounce in tt deduplicates overlapping fires.
#
# Installation:
#   1. Ensure `tt` is in your PATH
#   2. Add to ~/.tmux.conf: source-file /path/to/config/tmux-hook.conf
#   3. Reload tmux: tmux source-file ~/.tmux.conf
#   4. IMPORTANT: Detach and reattach for focus-events to take effect
#
# Verify it's working:
#   - Switch between panes/windows/sessions
#   - Check ~/.local/share/time-tracker/events.jsonl for new events
#   - Check ~/.local/state/time-tracker/hook.log for errors
#
# SECURITY: every tmux value handed to the shell uses the `#{q:...}` modifier, which
# shell-escapes it. NEVER interpolate a raw `#{pane_current_path}` / `#{session_name}`
# inside a quoted shell word — a path or session name containing $(...), backticks, or
# quotes would otherwise execute as shell code when the hook fires.

# Enable focus events (required for the client-focus-in hook)
set -g focus-events on

# Record pane focus changes for time tracking.
# - -ga appends to not clobber other hooks on the same event
# - -b runs in background (non-blocking, prevents pane switch lag)
# - #{q:...} shell-escapes each value (injection-safe)
# - stderr goes to hook.log for debuggability
#
# This file deliberately passes no --pane-pid. tt can identify the agent session in
# the focused pane from that pid's process tree, and passing it saves one tmux round
# trip -- but a hook config reaches a machine independently of the binary, and a tt
# that predates the flag exits non-zero on it. That is not a degraded optimisation,
# it is total capture loss: deploying this config to a host running an older tt
# killed every pane-focus event there for two and a half hours, silently, with the
# only trace in hook.log. `pane_session.rs` asks tmux for the pid when it is absent,
# so omitting it costs one round trip and removes the version coupling entirely.

# Terminal regains OS-level focus (e.g. alt-tab back to terminal).
# `client-focus-in`, not `pane-focus-in`: the latter is not a hook name tmux 3.7b
# knows, so `set-hook` accepted it silently and it never fired once. Check a hook
# appears in `tmux show-hooks -g` after setting it -- tmux does not error on an
# unknown name, so an unsupported hook is indistinguishable from a working one
# until you look for the events it should have produced.
set-hook -ga client-focus-in 'run-shell -b "mkdir -p $HOME/.local/state/time-tracker && tt ingest pane-focus --pane #{q:pane_id} --cwd #{q:pane_current_path} --session #{q:session_name} --window #{q:window_index} 2>>$HOME/.local/state/time-tracker/hook.log"'
# Switch panes within a window (e.g. Ctrl-b arrow)
set-hook -ga after-select-pane 'run-shell -b "mkdir -p $HOME/.local/state/time-tracker && tt ingest pane-focus --pane #{q:pane_id} --cwd #{q:pane_current_path} --session #{q:session_name} --window #{q:window_index} 2>>$HOME/.local/state/time-tracker/hook.log"'
# Switch windows within a session
set-hook -ga session-window-changed 'run-shell -b "mkdir -p $HOME/.local/state/time-tracker && tt ingest pane-focus --pane #{q:pane_id} --cwd #{q:pane_current_path} --session #{q:session_name} --window #{q:window_index} 2>>$HOME/.local/state/time-tracker/hook.log"'
# Switch between tmux sessions
set-hook -ga client-session-changed 'run-shell -b "mkdir -p $HOME/.local/state/time-tracker && tt ingest pane-focus --pane #{q:pane_id} --cwd #{q:pane_current_path} --session #{q:session_name} --window #{q:window_index} 2>>$HOME/.local/state/time-tracker/hook.log"'

# Scroll: entering copy-mode (mouse-wheel up, or a copy-mode keybinding) marks the
# pane active and refreshes the attention window at that moment. `tmux_scroll` is a
# direct-time signal -- `allocation.rs` treats it as confirming focus and resets the
# attention window -- so losing it silently under-counts attention during long reads.
#
# `after-copy-mode`, not `pane-mode-changed`, for the reason given above: the latter
# is not a hook tmux 3.7b supports, and this line produced **0 events in a 2.7M-event
# corpus** because of it. Verified by probe that `after-copy-mode` does fire.
#
# NOTE: this fires on copy-mode ENTER, not on every wheel tick -- long copy-mode
# reading past the attention window still relies on the cap. Per-tick capture would
# require binding the wheel keys in copy-mode (a separate, terminal-specific change).
set-hook -ga after-copy-mode 'run-shell -b "mkdir -p $HOME/.local/state/time-tracker && tt ingest scroll --pane #{q:pane_id} --cwd #{q:pane_current_path} --session #{q:session_name} --window #{q:window_index} 2>>$HOME/.local/state/time-tracker/hook.log"'
